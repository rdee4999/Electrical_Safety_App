
name: Build Vidyut Suraksha APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VidyutSuraksha_Android_Native_Project_Hindi_Update.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o VidyutSuraksha_Android_Project_Bullet_Illustrations_SOS.zip

      - name: Fix Android package names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("VidyutSurakshaAndroid")
          source = root / "app/src/main/java/in/vidyutsuraksha/app/MainActivity.kt"
          if source.exists():
              source.write_text(source.read_text().replace(
                  "package in.vidyutsuraksha.app",
                  "package com.vidyutsuraksha.app"
              ))

          gradle_file = root / "app/build.gradle.kts"
          if gradle_file.exists():
              content = gradle_file.read_text()
              content = content.replace(
                  'namespace = "in.vidyutsuraksha.app"',
                  'namespace = "com.vidyutsuraksha.app"'
              )
              content = content.replace(
                  'applicationId = "in.vidyutsuraksha.app"',
                  'applicationId = "com.vidyutsuraksha.app"'
              )
              gradle_file.write_text(content)
          PY

      - name: Set Java and Kotlin targets to 17
        working-directory: VidyutSurakshaAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Update existing Java compatibility settings.
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          # Ensure Android Java compilation targets JVM 17.
          if "compileOptions {" not in s:
              start = re.search(r'\bandroid\s*\{', s)
              if not start:
                  raise SystemExit("Could not find android { block")

              depth = 1
              i = start.end()
              while i < len(s) and depth:
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                  i += 1

              if depth:
                  raise SystemExit("Could not find end of android { block")

              s = s[:i-1] + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """ + s[i-1:]

          p.write_text(s)
          print("Updated Java compatibility to 17")
          PY

      - name: Generate Gradle wrapper and build APK
        working-directory: VidyutSurakshaAndroid
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VidyutSuraksha-debug-apk
          path: VidyutSurakshaAndroid/app/build/outputs/apk/debug/app-debug.apk
